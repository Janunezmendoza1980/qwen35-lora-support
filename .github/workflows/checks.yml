# Verificación del código del curso: no entrena pesos ni consume proveedores.
name: Contratos Python

# GitHub ejecuta los contratos cuando se publica código o se abre/actualiza una PR.
on:
  push:
  pull_request:

# Solo lectura del contenido: el job no necesita publicar ni escribir en el repo.
permissions:
  contents: read

jobs:
  contracts:
    # Linux de CI; pasar contratos aquí no acredita rendimiento de Mac/Windows/GPU.
    runs-on: ubuntu-24.04
    # Evita dejar una comprobación colgada indefinidamente.
    timeout-minutes: 10
    env:
      # Prohíbe descargas del Hub/Transformers durante esta verificación.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      # Descarga el código que se está verificando; las acciones se fijan por commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Instala el intérprete de la misma versión mayor/menor del curso.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Lock ligero: los contratos usan mocks, sin descargar Qwen ni necesitar GPU.
      - name: Instalar dependencias de contratos
        run: python -m pip install --require-hashes -r requirements.lock
      # Compilar comprueba sintaxis; tests verifican contratos; preflight informa
      # datos/paquetes/configuración. Ninguno garantiza una llamada remota real.
      - name: Compilar y ejecutar contratos sin inferencia externa
        run: |
          python -m compileall -q curso scripts tests
          python -m unittest discover -s tests -v
          python scripts/preflight.py
